name: agent-browser
# Minimal agentic browser — public GETs only. Triggers stay dispatch ONLY.
# Scramble protocol: NO secrets in this lane by construction (no env secrets, no auth);
# evidence/ holds third-party PUBLIC bytes only — never our numbers. URLs are sanitized
# (credentials + secret query params redacted) before fetch AND before commit, so a future
# authed-URL dispatch cannot land secrets in the public repo. Stdout stays quiet
# (boot line + one status line, no bodies). contents:write exists ONLY because this workflow
# commits evidence/ back (same pattern as dogfood.yml). Latency trims: no artifact upload
# (contents API is the read path), preinstalled-node fast path, DEPTH follows links in-run.
# CASE GUIDE (depth:breadth per case type — full table in scripts/browse.mjs header +
# src/ops/AGENT_BROWSER.md): discover = wide+shallow (depth 0, 8-12 seeds); inventory =
# render, don't crawl (depth 0 + apiCalls); proof = narrow+deep (depth 2, docs/faq/pricing
# only — depth 1 MISSED opire proof pre-depth); api-hunt = depth 1 wide + bundle-mine;
# repo-mine = raw files via CDN; search-sweep = 6-10 queries, depth 0; chain-read = RPC,
# don't browse. Depth 1 is the DEFAULT, not the best — pick CASE per question.
# GOOGLE MODE (2026-11-11): engine "google" runs through headless Chromium with a
# saved anonymous session (.browser-state.json via artifacts, NEVER committed) + stable
# fingerprint. Plain-fetch Google is OUT; runner browser is the only Google path.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array, e.g. [{"name":"opire-app","url":"https://app.opire.dev/"}] or [{"name":"q","search":{"engine":"ddg","query":"…"}}] or [{"name":"escrow","rpc":{"method":"eth_getBalance","params":["0xd0A0…","latest"]}}]'
        required: false
        default: '[{"name":"opire-app","url":"https://app.opire.dev/"}]'
      stamp:
        description: 'Evidence dir name under evidence/'
        required: false
        default: 'run'
      case:
        description: 'Preset depth:breadth ratio: discover | inventory | proof | api-hunt | repo-mine | search-sweep | chain-read (explicit depth/render/max_* override it)'
        required: false
        default: ''
      depth:
        description: '0 = targets only, 1 = follow links in-run, 2 = follow-of-follows (narrow docs/faq/pricing). Overrides CASE default.'
        required: false
        default: ''
      render:
        description: '0 = plain fetch (fast), 1 = headless Chromium render for JS shells (slower, +2-4 min install). Overrides CASE default.'
        required: false
        default: ''
      max_targets:
        description: 'Breadth cap: max seed/search/rpc targets (1-12). Overrides CASE default.'
        required: false
        default: ''
      max_follows:
        description: 'Breadth cap: max in-run follows (0-12). Overrides CASE default.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: restore browser session (anonymous cookies only, never committed)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: browser-state
          path: .
      - id: nodecheck
        run: |
          if command -v node >/dev/null && [ "$(node -p 'process.versions.node.split(".")[0]}')" -ge 20 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.nodecheck.outputs.ok != 'true'
        with:
          node-version: 20
      - run: node --check scripts/browse.mjs
      # QUEUED (do not push until demand7 proves browser-only install): cache the
      # 150MB Chromium download so later runs skip it. Pinned version + cache key
      # must change together, so this ships as one variable AFTER demand7 lands.
      # - uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/ms-playwright
      #     key: playwright-chromium-1-49-1
      - run: |
          NEED_PW=0
          if [ "${{ inputs.render }}" = "1" ]; then NEED_PW=1; fi
          case "${{ inputs.case }}" in *demand*) NEED_PW=1;; esac
          if [ "$NEED_PW" = "1" ]; then npm init -y >/dev/null 2>&1; npm pkg set type=module >/dev/null 2>&1; npm i playwright@latest && (npx playwright install chromium || npx playwright install chromium --only-shell); fi
      - run: node scripts/browse.mjs
        env:
          TARGETS_JSON: ${{ inputs.targets }}
          STAMP: ${{ inputs.stamp }}
          CASE: ${{ inputs.case }}
          DEPTH: ${{ inputs.depth }}
          RENDER: ${{ inputs.render }}
          MAX_TARGETS: ${{ inputs.max_targets }}
          MAX_FOLLOWS: ${{ inputs.max_follows }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROWSER_STATE: .browser-state.json
      - name: save browser session (anonymous cookies only)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-state
          path: .browser-state.json
          if-no-files-found: ignore
          retention-days: 14
      - run: |
          git config user.name "agent-browser"
          git config user.email "agent-browser@users.noreply.github.com"
          git add evidence/ || true
          git diff --cached --quiet || git commit -m "browse $STAMP $(date -u +%FT%TZ)"
          for i in 1 2 3; do git fetch origin main >/dev/null 2>&1; git rebase origin/main >/dev/null 2>&1 || git rebase --abort; git push && break || sleep 10; done
        env:
          STAMP: ${{ inputs.stamp }}
