name: agent-browser
# Minimal agentic browser — public GETs only. Triggers stay dispatch ONLY.
# Scramble protocol: NO secrets in this lane by construction (no env secrets, no auth);
# evidence/ holds third-party PUBLIC bytes only — never our numbers. URLs are sanitized
# (credentials + secret query params redacted) before fetch AND before commit, so a future
# authed-URL dispatch cannot land secrets in the public repo. Stdout stays quiet
# (one status line, no bodies). contents:write exists ONLY because this workflow commits
# evidence/ back (same pattern as dogfood.yml). Latency trims: no artifact upload (contents
# API is the read path), preinstalled-node fast path, DEPTH follows links in-run.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array, e.g. [{"name":"opire-app","url":"https://app.opire.dev/"}] or [{"name":"q","search":{"engine":"ddg","query":"…"}}]'
        required: false
        default: '[{"name":"opire-app","url":"https://app.opire.dev/"}]'
      stamp:
        description: 'Evidence dir name under evidence/'
        required: false
        default: 'run'
      depth:
        description: '0 = targets only, 1 = also follow interesting links in-run (one run does hop chains)'
        required: false
        default: '0'
      render:
        description: '0 = plain fetch (fast), 1 = headless Chromium render for JS shells (slower, +2-4 min install)'
        required: false
        default: '0'
permissions:
  contents: write
jobs:
  browse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: nodecheck
        run: |
          if command -v node >/dev/null && [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 20 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.nodecheck.outputs.ok != 'true'
        with:
          node-version: 20
      - run: node --check scripts/browse.mjs
      - run: |
          if [ "${{ inputs.render }}" = "1" ]; then npm init -y >/dev/null 2>&1; npm pkg set type=module >/dev/null 2>&1; npm i playwright@latest && npx playwright install chromium --with-deps; fi
      - run: node scripts/browse.mjs
        env:
          TARGETS_JSON: ${{ inputs.targets }}
          STAMP: ${{ inputs.stamp }}
          DEPTH: ${{ inputs.depth }}
          RENDER: ${{ inputs.render }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "agent-browser"
          git config user.email "agent-browser@users.noreply.github.com"
          git add evidence/ || true
          git diff --cached --quiet || git commit -m "browse $STAMP $(date -u +%FT%TZ)"
          git push
        env:
          STAMP: ${{ inputs.stamp }}
