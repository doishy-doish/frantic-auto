name: game-clone
# Clone dungeon-crawler @ pinned commit, commit base files as evidence (read path).
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf game && git clone https://agent-forge-hb.fly.dev/r/dungeon-crawler.git game
          cd game && git checkout 2a1f3fd473ac0fed38fcb0a25cff97c8cf812137
          git log --oneline -3 && ls -la && wc -c level-2.html || true
      - run: |
          mkdir -p evidence/game-base
          cp game/level-2.html evidence/game-base/level-2.html
          (cd game && git log --oneline -5 > ../evidence/game-base/log.txt) || true
          (cd game && git show --stat HEAD | head -20 > ../evidence/game-base/head-stat.txt) || true
          git config user.name game-clone && git config user.email game-clone@users.noreply.github.com
          git add evidence/ || true
          git diff --cached --quiet || git commit -m "game base @2a1f3fd"
          git push
