name: rbx-fresh
# Roblox forecast submit — deterministic split-custody lane.
# The payout key NEVER touches this runner (stored GH secrets kill workflow boot —
# proven 5/5 startup_failure). Instead the worker builds identical bytes page-side,
# signs in worker RAM, and passes single-use wallet-bound inputs here. This runner
# rebuilds, asserts sha equality (fail fast), mints a throwaway af_ key for POST
# auth only, and submits. Legacy mode (no bundle_inputs) is DRY-only throwaway.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = build + verify + rebuild-match only, no POST (default 1)'
        required: false
        default: '1'
      bundle_inputs:
        description: 'JSON {round,sig,wallet,tickBase,rootTs,tipTs,nonce,issuedAt} — DET mode rebuild params'
        required: false
        default: ''
      entry_message:
        description: 'Worker-signed entry message (single-use, wallet-bound)'
        required: false
        default: ''
      entry_signature:
        description: 'Ed25519 base58 signature of entry_message by the payout wallet'
        required: false
        default: ''
      expect_bundle_sha:
        description: 'Worker-computed bundle sha256 hex — rebuild must match'
        required: false
        default: ''
      expect_transcripts_sha:
        description: 'Worker-computed transcripts sha256 hex — rebuild must match'
        required: false
        default: ''
      require_reg:
        description: '1 = fail unless the account wallet register reads back (Run A probe)'
        required: false
        default: ''
      reg_message:
        description: 'Worker-signed wallet-link message for POST /api/me/wallets'
        required: false
        default: ''
      reg_signature:
        description: 'Payout-wallet signature of reg_message'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd rbx-run && node --check rbx-submit.mjs && node --check bundle.mjs && node --check session.mjs
      - run: cd rbx-run && node rbx-submit.mjs 2>&1 | tee /tmp/rbx-out.txt; test ${PIPESTATUS[0]} -eq 0
        env:
          DRY: ${{ inputs.dry_run }}
          BUNDLE_INPUTS_JSON: ${{ inputs.bundle_inputs }}
          ENTRY_MESSAGE: ${{ inputs.entry_message }}
          ENTRY_SIG: ${{ inputs.entry_signature }}
          EXPECT_BUNDLE_SHA: ${{ inputs.expect_bundle_sha }}
          EXPECT_TRANSCRIPTS_SHA: ${{ inputs.expect_transcripts_sha }}
          REQUIRE_REG: ${{ inputs.require_reg }}
          REG_MESSAGE: ${{ inputs.reg_message }}
          REG_SIG: ${{ inputs.reg_signature }}
      - name: publish result
        if: always()
        run: |
          set +e
          { echo "RUN_ID=${GITHUB_RUN_ID} DRY=${{ inputs.dry_run }}"; echo '---'; cat /tmp/rbx-out.txt 2>/dev/null || echo NO_OUTPUT; } > /tmp/rbx-result.txt
          cd /tmp && rm -rf rbxres && mkdir rbxres && cp /tmp/rbx-result.txt rbxres/ && cd rbxres
          git init -qb main && git config user.name rbx-fresh && git config user.email rbx-fresh@local.invalid
          git add -A && git commit -qm "rbx submit result ${GITHUB_RUN_ID} dry=${{ inputs.dry_run }}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/doishy-doish/frantic-auto.git"
          git push -qf origin HEAD:rbx-submit-logs && echo published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
