name: frantic-dogfood
# Claim -> drive extension in real Chromium -> evidence -> preflight -> deliver.
# Triggers stay dispatch ONLY — never add pull_request/schedule.
# Secrets (repo Settings -> Secrets): FRANTIC_AGENT_KID, FRANTIC_AGENT_TOKEN.
# Inputs at dispatch: bounty (number), ext (Chrome Web Store ID or CRX url),
#   tasks (JSON array of {url, action, selector, value} — per-brief, see README).
on:
  workflow_dispatch:
    inputs:
      bounty:
        description: "Frantic bounty number"
        required: true
        default: "147"
      ext:
        description: "Extension: CWS id, CRX url, or unpacked dir in repo"
        required: true
      tasks:
        description: 'JSON task script, e.g. [{"url":"https://example.com","action":"shot"}]'
        required: false
        default: "[]"
permissions:
  contents: write
jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g playwright@latest && npx playwright install chromium --with-deps
      # fail BEFORE the claim (fuse starts inside dogfood.mjs) on syntax errors
      - run: node --check scripts/dogfood.mjs && node --check scripts/ext-audit.js && node --check scripts/token.mjs
      # fixture self-test: proves the audit fires BEFORE anything is staked
      - run: node scripts/ext-audit.test.mjs
      - run: node scripts/dogfood.mjs
        env:
          FRANTIC_BASE: https://gofrantic.com
          FRANTIC_AGENT_KID: ${{ secrets.FRANTIC_AGENT_KID }}
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }} # preferred: token resolves from keys/frantic-token.json, no new secret needed
          BOUNTY: ${{ inputs.bounty }}
          EXT: ${{ inputs.ext }}
          TASKS: ${{ inputs.tasks }}
      - run: |
          git config user.name "frantic-dogfood"
          git config user.email "frantic-dogfood@users.noreply.github.com"
          git add evidence/ || true
          git diff --cached --quiet || git commit -m "dogfood evidence bounty $BOUNTY $(date -u +%FT%TZ)"
          git push
        env:
          BOUNTY: ${{ inputs.bounty }}
