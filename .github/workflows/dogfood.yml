name: frantic-dogfood
# Claim -> drive extension in real Chromium -> evidence -> preflight -> deliver.
# Triggers stay dispatch ONLY — never add pull_request/schedule.
# Secrets (repo Settings -> Secrets): SCRAMBLE (token wrapper key).
# Optional: FRANTIC_AGENT_KID (public id, defaults to agent-4bc19b in code),
# FRANTIC_AGENT_TOKEN (direct token; empty = resolve from keys/frantic-token.json).
# Inputs at dispatch: bounty (number). EXT/TASKS optional: empty EXT derives
# the extension from the sealed claim brief; empty TASKS runs a launch+shot smoke.
on:
  workflow_dispatch:
    inputs:
      bounty:
        description: "Frantic bounty number"
        required: true
        default: "147"
      ext:
        description: "Extension: CWS id, CRX url, or unpacked dir in repo (empty = derive from brief)"
        required: false
        default: ""
      tasks:
        description: 'JSON task script, e.g. [{"url":"https://example.com","action":"shot"}] (empty = launch+shot smoke)'
        required: false
        default: "[]"
permissions:
  contents: write
jobs:
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g playwright@latest && npx playwright install chromium --with-deps
      # fail BEFORE the claim (fuse starts inside dogfood.mjs) on syntax errors
      - run: node --check scripts/dogfood.mjs && node --check scripts/deliver.mjs && node --check scripts/ext-audit.js && node --check scripts/token.mjs
      # fixture self-test: proves the audit fires BEFORE anything is staked
      - run: node scripts/ext-audit.test.mjs
      - run: node scripts/dogfood.mjs
        env:
          FRANTIC_BASE: https://gofrantic.com
          FRANTIC_AGENT_KID: ${{ secrets.FRANTIC_AGENT_KID }}
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }} # token resolves from keys/frantic-token.json, no new secret needed
          BOUNTY: ${{ inputs.bounty }}
          EXT: ${{ inputs.ext }}
          TASKS: ${{ inputs.tasks }}
      - run: |
          git config user.name "frantic-dogfood"
          git config user.email "frantic-dogfood@users.noreply.github.com"
          git add evidence/ || true
          git diff --cached --quiet || git commit -m "dogfood evidence bounty $BOUNTY $(date -u +%FT%TZ)"
          git push
          echo "EVIDENCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        env:
          BOUNTY: ${{ inputs.bounty }}
      - run: node scripts/deliver.mjs
        env:
          FRANTIC_BASE: https://gofrantic.com
          FRANTIC_AGENT_KID: ${{ secrets.FRANTIC_AGENT_KID }}
          FRANTIC_AGENT_TOKEN: ${{ secrets.FRANTIC_AGENT_TOKEN }}
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
          BOUNTY: ${{ inputs.bounty }}
          REPO: ${{ github.repository }}
          EVIDENCE_SHA: ${{ env.EVIDENCE_SHA }}
