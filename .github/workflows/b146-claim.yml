name: b146-claim
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/b146-claim.mjs
      - run: node scripts/b146-claim.mjs
        env:
          FRANTIC_BASE: https://gofrantic.com
          FRANTIC_AGENT_KID: agent-4bc19b
          SCRAMBLE_KEY: ${{ secrets.SCRAMBLE }}
          WRAP_PATH: keys/frantic-token-rot.json
      - run: |
          git config user.name b146-claim
          git config user.email b146-claim@users.noreply.github.com
          git add evidence/ || true
          git diff --cached --quiet || git commit -m b146-claim-hold
          git push
